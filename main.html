<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delicious Apples</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #2ecc71;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    /* ── Card wrapper ── */
    .product {
      display: flex;
      background-color: #ffffff;
      border-radius: 16px;
      overflow: visible;
      width: 780px;
      min-height: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      position: relative;
    }

    /* ── LEFT: Product Photo ── */
    .product__photo {
      width: 320px;
      min-width: 320px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .photo-container {
      position: relative;
      background: linear-gradient(160deg, #8ddd3c, #4fc908);
      border-radius: 12px 0 0 0;
      flex: 1;
      overflow: hidden;
    }

    /* share & heart icons */
    .photo-container .icons {
      position: absolute;
      top: 14px;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 2;
    }

    .photo-container .icons span {
      color: #fff;
      font-size: 18px;
      cursor: pointer;
    }

    .photo-main {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
      padding: 20px;
    }

    .photo-main img {
      width: 260px;
      height: 260px;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
    }

    /* Photo album thumbnails */
    .photo-album {
      background-color: #f9f9f9;
      border-radius: 0 0 0 12px;
      padding: 12px;
      border-top: 1px solid #eee;
    }

    .photo-album ul {
      list-style: none;
      display: flex;
      gap: 8px;
      justify-content: center;
    }

    .photo-album ul li {
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 4px;
      cursor: pointer;
      background: #fff;
    }

    .photo-album ul li img {
      width: 52px;
      height: 52px;
      object-fit: contain;
      display: block;
    }

    /* ── RIGHT: Product Details ── */
    .product__info {
      flex: 1;
      padding: 36px 32px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .product__info h1 {
      font-size: 26px;
      font-weight: bold;
      color: #2d2d2d;
    }

    .product__info .code {
      font-size: 12px;
      color: #aaa;
      letter-spacing: 0.5px;
      margin-top: -12px;
    }

    /* Price */
    .price {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .price .currency {
      font-size: 16px;
      color: #e74c3c;
      font-weight: bold;
    }

    .price .amount {
      font-size: 52px;
      font-weight: bold;
      color: #e74c3c;
      line-height: 1;
    }

    /* Color variants */
    .variant-label {
      font-size: 11px;
      font-weight: bold;
      color: #999;
      letter-spacing: 1px;
    }

    .variant {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .variant__color {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #ddd;
      cursor: pointer;
      padding: 2px;
      background: #fff;
    }

    .variant__color.active {
      border-color: #2ecc71;
    }

    .variant__color img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    /* Benefits */
    .description .benefits-title {
      font-size: 11px;
      font-weight: bold;
      color: #999;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .description ul {
      list-style: disc;
      padding-left: 18px;
    }

    .description ul li {
      font-size: 13.5px;
      color: #444;
      padding: 3px 0;
      line-height: 1.5;
    }

    /* Add to Cart button */
    .add-to-cart {
      margin-top: auto;
    }

    .add-to-cart button {
      width: 100%;
      padding: 16px;
      background-color: #e74c3c;
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 1.5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .add-to-cart button:hover {
      background-color: #c0392b;
    }
  </style>
</head>
<body>

  <div class="product">

    <!-- LEFT: Photo -->
    <div class="product__photo">
      <div class="photo-container">
        <div class="icons">
          <span>&#10094;</span>
          <span>&#9825;</span>
        </div>
        <div class="photo-main">
          <img
            src="https://res.cloudinary.com/john-mantas/image/upload/v1537302064/codepen/delicious-apples/green-apple2.png"
            alt="Green Apple">
        </div>
      </div>

      <div class="photo-album">
        <ul>
          <li>
            <img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302064/codepen/delicious-apples/green-apple2.png" alt="View 1">
          </li>
          <li>
            <img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302752/codepen/delicious-apples/yellow-apple.png" alt="View 2">
          </li>
          <li>
            <img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302427/codepen/delicious-apples/orange-apple.png" alt="View 3">
          </li>
          <li>
            <img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302285/codepen/delicious-apples/red-apple.png" alt="View 4">
          </li>
        </ul>
      </div>
    </div>

    <!-- RIGHT: Info -->
    <div class="product__info">

      <div>
        <h1>Delicious Apples</h1>
        <p class="code">CODE: 45999</p>
      </div>

      <div class="price">
        <span class="currency">R$</span>
        <span class="amount">7.93</span>
      </div>

      <div>
        <p class="variant-label">SELECT A COLOR</p>
        <div class="variant">
          <div class="variant__color active">
            <img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302064/codepen/delicious-apples/green-apple2.png" alt="Green">
          </div>
          <div class="variant__color">
            <img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302752/codepen/delicious-apples/yellow-apple.png" alt="Yellow">
          </div>
          <div class="variant__color">
            <img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302427/codepen/delicious-apples/orange-apple.png" alt="Orange">
          </div>
          <div class="variant__color">
            <img src="https://res.cloudinary.com/john-mantas/image/upload/v1537302285/codepen/delicious-apples/red-apple.png" alt="Red">
          </div>
        </div>
      </div>

      <div class="description">
        <p class="benefits-title">BENEFITS</p>
        <ul>
          <li>Apples are nutritious</li>
          <li>Apples may be good for weight loss</li>
          <li>Apples may be good for bone health</li>
          <li>They're linked to a lowest risk of diabetes</li>
        </ul>
      </div>

      <div class="add-to-cart">
        <button>ADD TO CART</button>
      </div>

    </div>
  </div>

</body>
</html>
